<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>My account</title>
  <link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f7f5; --surface:#fff; --text:#0f1f19; --text-2:#5b6b64; --border:#e2e9e5; --accent:#0f7a5a; --accent-light:#e3f3ec; --good:#0f9f6e; --bad:#dc2626; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0c1411; --surface:#141f1a; --text:#e8f0ec; --text-2:#93a59c; --border:#24342c; --accent:#34c494; --accent-light:#17342a; } }
    * { box-sizing:border-box; } body { margin:0; font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:560px; margin:0 auto; padding:24px 16px 60px; }
    .brand { text-align:center; margin-bottom:18px; } .brand h1 { margin:0; font-size:1.4rem; font-weight:800; } .brand h1 span { color:var(--accent); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; }
    h2 { margin:0 0 4px; font-size:1.25rem; } h3 { margin:0 0 10px; font-size:1rem; } .muted { color:var(--text-2); font-size:.88rem; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-top:14px; }
    .kpi { background:var(--accent-light); border-radius:14px; padding:12px; } .kpi b { display:block; font-size:1.5rem; margin-top:2px; } .kpi.bad { background:#fde8e8; color:#7f1d1d; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); font-size:.93rem; } .row:first-of-type { border-top:none; }
    .row .r { text-align:right; white-space:nowrap; } .bar { height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin-top:6px; } .bar i { display:block; height:100%; background:var(--accent); }
    .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:.72rem; font-weight:700; background:var(--accent-light); color:var(--accent); text-transform:capitalize; }
    .btn { display:inline-block; padding:12px 16px; border-radius:12px; font-weight:700; font-size:.93rem; text-decoration:none; border:none; cursor:pointer; font-family:inherit; }
    .btn-primary { background:var(--accent); color:#fff; } .btn-ghost { background:transparent; color:var(--accent); padding:6px 8px; font-size:.85rem; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; } a { color:var(--accent); }
    #print-area { display:none; }
    @media print { body > .wrap { display:none; } #print-area { display:block; color:#000; font-family:'Inter',sans-serif; padding:24px; }
      #print-area table { width:100%; border-collapse:collapse; margin:18px 0; } #print-area td { padding:8px 0; border-bottom:1px solid #ddd; } #print-area .num { text-align:right; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><h1 id="biz">LUZ <span>EMS</span></h1></div>
    <div id="app"><div class="card"><p class="muted">Loading your account…</p></div></div>
  </div>
  <div id="print-area"></div>
  <script>
    const token = location.pathname.split('/').pop();
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    let D = null;
    const money = n => `${D.currency} ${Number(n || 0).toLocaleString('en', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
    const card = (title, body) => `<div class="card"><h3>${title}</h3>${body}</div>`;
    const empty = t => `<p class="muted">${t}</p>`;

    async function load() {
      const r = await fetch(`/api/public/portal/${encodeURIComponent(token)}`);
      const d = await r.json();
      if (!r.ok) { document.getElementById('app').innerHTML = card('Link not active', `<p class="muted">${esc(d.detail)}</p>`); return; }
      D = d;
      document.getElementById('biz').innerHTML = esc(d.business.name).replace(/ (\S+)$/, ' <span>$1</span>');
      document.title = `${d.name} · ${d.business.name}`;
      const active = d.packages.filter(p => p.active);
      const left = active.reduce((a, p) => a + p.sessions_remaining, 0);
      const next = d.upcoming[0];
      const phone = (d.business.phone || '').replace(/[^\d+]/g, '');
      let html = `<div class="card"><h2>Hi ${esc(d.name.split(' ')[0])} 👋</h2><p class="muted">Your sessions, packages, payments and progress, always up to date.</p>
        <div class="kpis"><div class="kpi">Sessions left<b>${left}</b></div>
        <div class="kpi">Next session<b style="font-size:1rem">${next ? `${esc(next.date.split(',')[0])}<br>${esc(next.time)}` : '—'}</b></div>
        ${d.owed > 0 ? `<div class="kpi bad">To pay<b>${money(d.owed)}</b></div>` : ''}</div>
        <div class="actions">${d.online_booking ? '<a class="btn btn-primary" href="/book">Book a session</a>' : ''}
        ${phone ? `<a class="btn btn-ghost" href="https://wa.me/${esc(phone.replace('+', ''))}">WhatsApp the studio</a><a class="btn btn-ghost" href="tel:${esc(phone)}">Call</a>` : ''}</div></div>`;

      html += card('Upcoming sessions', d.upcoming.length ? d.upcoming.map(a => `<div class="row"><div><b>${esc(a.date)}</b><div class="muted">${esc(a.time)} · ${esc(a.service)}${a.staff ? ' · ' + esc(a.staff) : ''}</div></div>
        <div class="r"><span class="badge">${esc(a.status)}</span><br><a class="btn btn-ghost" href="/a/${encodeURIComponent(a.token)}">Change / cancel</a></div></div>`).join('') : empty('No sessions booked.'));

      html += card('My packages', d.packages.length ? d.packages.map(p => `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>${esc(p.name)}</b><span class="badge">${p.active ? 'active' : 'ended'}</span></div>
        <div class="muted">${p.sessions_remaining} of ${p.sessions_total} sessions left${p.end ? ` · valid until ${esc(p.end)}` : ''}</div>
        <div class="bar"><i style="width:${p.sessions_total ? Math.round(100 * p.sessions_used / p.sessions_total) : 0}%"></i></div></div>`).join('') : empty('No packages yet.'));

      if (d.progress.length) {
        const first = d.progress[0], last = d.progress[d.progress.length - 1];
        const diff = (k, unit) => first[k] != null && last[k] != null && d.progress.length > 1 ? ` <span class="muted">(${last[k] - first[k] > 0 ? '+' : ''}${(last[k] - first[k]).toFixed(1)} ${unit} since ${esc(first.date)})</span>` : '';
        html += card('My progress', `${last.weight_kg != null ? `<div class="row"><span>Weight</span><span class="r"><b>${last.weight_kg} kg</b>${diff('weight_kg', 'kg')}</span></div>` : ''}
          ${last.body_fat_pct != null ? `<div class="row"><span>Body fat</span><span class="r"><b>${last.body_fat_pct}%</b>${diff('body_fat_pct', '%')}</span></div>` : ''}
          ${last.muscle_kg != null ? `<div class="row"><span>Muscle</span><span class="r"><b>${last.muscle_kg} kg</b>${diff('muscle_kg', 'kg')}</span></div>` : ''}
          ${last.waist_cm != null ? `<div class="row"><span>Waist</span><span class="r"><b>${last.waist_cm} cm</b>${diff('waist_cm', 'cm')}</span></div>` : ''}
          <p class="muted" style="margin:8px 0 0">Last check-in: ${esc(last.date)} · ${d.progress.length} check-in${d.progress.length > 1 ? 's' : ''}</p>`);
      }

      html += card('Payments and invoices', d.payments.length ? d.payments.map(p => `<div class="row"><div><b>${money(p.amount)}</b><div class="muted">${esc(p.date)} · ${esc(p.for)} · ${esc(p.method)}</div></div>
        <div class="r"><button class="btn btn-ghost" data-invoice="${p.id}">Invoice</button></div></div>`).join('') : empty('No payments yet.'));

      html += card('Past sessions', d.history.length ? d.history.map(a => `<div class="row"><div>${esc(a.date)}<div class="muted">${esc(a.time)} · ${esc(a.service)}</div></div><span class="badge">${a.status === 'no_show' ? 'missed' : 'done'}</span></div>`).join('') : empty('No sessions yet.'));

      document.getElementById('app').innerHTML = html;
    }

    document.addEventListener('click', async e => {
      const id = e.target.dataset && e.target.dataset.invoice;
      if (!id) return;
      const r = await fetch(`/api/public/portal/${encodeURIComponent(token)}/invoice/${encodeURIComponent(id)}`);
      if (!r.ok) return;
      const inv = await r.json();
      const m = n => `${inv.currency} ${Number(n).toFixed(2)}`;
      document.getElementById('print-area').innerHTML = `<h2>${esc(inv.business.name)}</h2><div>${esc(inv.business.address || '')} ${esc(inv.business.phone || '')}</div>
        <h3 style="margin-top:20px">Invoice ${esc(inv.number)}</h3><div>Date: ${esc(inv.date)}</div><div>Billed to: ${esc(inv.client.name)}</div>
        <table>${inv.lines.map(l => `<tr><td>${esc(l.description)}</td><td class="num">${m(l.amount)}</td></tr>`).join('')}
        <tr><td><b>Total paid (${esc(inv.method)})</b></td><td class="num"><b>${m(inv.total)}</b></td></tr></table><div>Thank you!</div>`;
      const title = document.title; document.title = inv.number; window.print(); document.title = title;
    });
    load();
  </script>
</body>
</html>
