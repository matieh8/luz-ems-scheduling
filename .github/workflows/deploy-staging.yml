name: Deploy Staging to Server

on:
  push:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |  # failures also show as annotations on the run page
          set -o pipefail
          python -m pytest -q tests -rf --tb=short 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|ERROR)|^E ' pytest.log | head -30 | sed 's/^/::error ::/'; exit 1; }

  deploy-staging:
    needs: test  # never deploy a build whose tests fail
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            /home/ubuntu/luz_ems_scheduling_staging/deploy.sh
